<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashtag Suggestions Generator - Instagram & TikTok</title>
    <meta name="description"
        content="Generate viral hashtag suggestions for Instagram, TikTok, and Twitter. Boost your reach with the best hashtags." />
  <script type="module" crossorigin src="/assets/hashtag-CR18GoeJ.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/style-vm8_bK0d.js">
  <link rel="stylesheet" crossorigin href="/assets/style-He1ruJs4.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <span>✨ TextTools</span>
                </a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/about/">About</a>
                    <a href="/contact/">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Hashtag Generator</h1>
                <p>Get trending hashtag ideas for your social media posts.</p>
            </div>
        </section>

        <section class="container tool-container">
            <div class="input-group">
                <label for="keyword-input" style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Enter a
                    keyword:</label>
                <input type="text" id="keyword-input" placeholder="e.g., travel, fitness, food" />
                <button id="generate-btn" class="primary-btn" style="width: 100%;">Generate Hashtags</button>
            </div>

            <div id="results" class="result-box hidden">
                <h3 style="margin-bottom: 0.5rem;">Copy these hashtags:</h3>
                <div id="tags-list"
                    style="background: var(--surface); padding: 1rem; border: 1px solid var(--border); border-radius: 0.5rem; color: var(--primary);">
                </div>
                <button id="copy-btn" class="primary-btn" style="margin-top: 1rem; background: var(--text-scnd);">Copy
                    to Clipboard</button>
            </div>
        </section>

        <!-- AdSense Placeholder -->
        <div class="container"
            style="text-align: center; margin: 2rem 0; background: var(--border); padding: 1rem; border-radius: 0.5rem;">
            <p style="color: var(--text-scnd); font-size: 0.875rem;">Advertisement</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 TextTools. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
